<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF7E67">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="96x96" href="icono-96.png">
  <title>Sala de Amigas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-sala">
  <nav class="barra-superior">
    <span class="logo">🌸 Sala</span>
    <div class="info-usuario">
      <span id="nombreUsuario">Tú</span>
      <a href="login.html" class="boton-salir">Salir</a>
    </div>
  </nav>

  <main class="contenido">
    <h2>¡Hola, <span id="saludoNombre">amiga</span>! 👋</h2>
    <p class="descripcion">Estas son las personas conectadas ahora mismo:</p>

    <div class="buscador">
      <input type="text" id="buscar" placeholder="🔍 Buscar persona…">
    </div>

    <div class="lista-personas" id="listaPersonas">
      <div style="text-align:center; padding:40px; color:#888;">Cargando…</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
