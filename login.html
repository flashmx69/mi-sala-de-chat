<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="estilos.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="pagina-login">
  <div class="caja-login">
    <h2>👋 Bienvenida</h2>
    
    <div class="campo">
      <label>Tu nombre</label>
      <input type="text" id="nombreUsuario" placeholder="Escribe tu nombre">
    </div>
    
    <div class="campo">
      <label>Contraseña</label>
      <input type="password" id="passUsuario" placeholder="Tu contraseña">
    </div>
    
    <button onclick="entrar()">Entrar a la sala</button>
  </div>
</div>

<script>
function entrar(){
  const nombre = document.getElementById('nombreUsuario').value.trim();
  if(nombre){
    localStorage.setItem('usuarioNombre', nombre);
    window.location.href = 'sala.html';
  }else{
    alert('Escribe tu nombre por favor');
  }
}
</script>

</body>
</html>
