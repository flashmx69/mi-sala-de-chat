<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="pagina-login">
  <div class="burbuja b1"></div>
  <div class="burbuja b2"></div>
  <div class="burbuja b3"></div>

  <div class="contenedor-login">
    <div class="lado-izquierdo">
      <h2>¡Bienvenida! 💕</h2>
      <p>Conéctate con tus amigas en cualquier momento y desde cualquier lugar.</p>
      <div class="beneficios">
        <p>✅ Mensajes en tiempo real</p>
        <p>✅ Videollamadas</p>
        <p>✅ Gratis y seguro</p>
      </div>
      <div class="enlace-inicio">
        <a href="index.html">← Volver al inicio</a>
      </div>
    </div>

    <div class="lado-derecho">
      <div class="pestañas">
        <button id="btnEntrar" class="pestaña activa">Entrar</button>
        <button id="btnRegistrarse" class="pestaña">Registrarme</button>
      </div>

      <form id="formEntrar" class="formulario visible">
        <div class="campo">
          <label>Correo electrónico</label>
          <input type="email" id="correo" placeholder="tu@correo.com">
          <div class="error" id="errorCorreo">Escribe un correo válido</div>
        </div>
        <div class="campo">
          <label>Contraseña</label>
          <input type="password" id="clave" placeholder="Mínimo 6 caracteres">
          <button type="button" class="ojito" id="btnOjo">👁️</button>
          <div class="error" id="errorClave">Mínimo 6 caracteres</div>
        </div>
        <button type="submit" class="boton">Entrar</button>
      </form>

      <form id="formRegistro" class="formulario">
        <div class="campo">
          <label>Tu nombre</label>
          <input type="text" id="nombre" placeholder="¿Cómo te llamas?">
          <div class="error" id="errorNombre">Escribe tu nombre</div>
        </div>
        <div class="campo">
          <label>Correo electrónico</label>
          <input type="email" id="correoReg" placeholder="tu@correo.com">
          <div class="error" id="errorCorreoReg">Escribe un correo válido</div>
        </div>
        <div class="campo">
          <label>Contraseña</label>
          <input type="password" id="claveReg" placeholder="Mínimo 6 caracteres">
          <button type="button" class="ojito" id="btnOjo2">👁️</button>
          <div class="error" id="errorClaveReg">Mínimo 6 caracteres</div>
        </div>
        <button type="submit" class="boton">Crear cuenta</button>
      </form>

      <div class="exito" id="mensajeExito">
        <h3>🎉 ¡Listo!</h3>
        <p id="textoExito"></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
