<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de Amigas · Conectadas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
/* =====================================================
   sala.css  ·  DISEÑO de la Sala de Conectadas
   ===================================================== */

:root{
  --fondo-claro:#FFF7F0;
  --fondo-oscuro:#1E1B2E;
  --tarjeta-claro:#FFFFFF;
  --tarjeta-oscuro:#2A2640;
  --texto-claro:#3D3550;
  --texto-oscuro:#F0ECFF;
  --texto-suave-claro:#8A8299;
  --texto-suave-oscuro:#A8A2C0;
  --principal:#FF7E67;
  --principal-oscuro:#E8654F;
  --secundario:#4ECDC4;
  --acento:#FFD166;
  --borde-claro:#F0E6DC;
  --borde-oscuro:#3D3858;
  --en-linea:#2EC4B6;
  --ocupada:#FF9F1C;
  --ausente:#FFD166;
  --desconectada:#C2BDD0;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Quicksand',sans-serif;
  background:var(--fondo-claro);
  color:var(--texto-claro);
  min-height:100vh;
  transition:background .4s,color .4s;
}
body.oscuro{background:var(--fondo-oscuro);color:var(--texto-oscuro)}

/* ===== Barra superior ===== */
.barra-superior{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 28px;
  background:var(--tarjeta-claro);
  box-shadow:0 2px 12px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:10;
  transition:background .4s;
}
body.oscuro .barra-superior{background:var(--tarjeta-oscuro)}
.logo-chico{font-family:'Pacifico',cursive;font-size:22px;color:var(--principal)}

.info-centro{display:flex;align-items:baseline;gap:8px}
.contador{
  font-size:28px;
  font-weight:700;
  color:var(--en-linea);
  animation:latido 1.6s ease-in-out infinite;
}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.texto-contador{font-size:13px;color:var(--texto-suave-claro);font-weight:600}
body.oscuro .texto-contador{color:var(--texto-suave-oscuro)}

.derecha{display:flex;align-items:center;gap:16px}
.btn-tema{
  width:40px;height:40px;border-radius:50%;border:none;
  background:var(--fondo-claro);cursor:pointer;font-size:18px;
  transition:transform .2s,background .4s;
}
body.oscuro .btn-tema{background:var(--fondo-oscuro)}
.btn-tema:hover{transform:scale(1.1) rotate(15deg)}
.mi-perfil{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}

/* Avatares (caritas) */
.avatar{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--acento),var(--principal));
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
  position:relative;
}
.avatar.yo{background:linear-gradient(135deg,var(--secundario),var(--principal))}

/* Puntito de estado (verde/naranja/etc) */
.avatar .estado{
  position:absolute;
  bottom:0;right:0;
  width:14px;height:14px;
  border-radius:50%;
  border:3px solid var(--tarjeta-claro);
}
body.oscuro .avatar .estado{border-color:var(--tarjeta-oscuro)}
.estado.en-linea{background:var(--en-linea)}
.estado.ocupada{background:var(--ocupada)}
.estado.ausente{background:var(--ausente)}
.estado.desconectada{background:var(--desconectada)}

/* ===== Contenido ===== */
.contenido{
  max-width:640px;
  margin:0 auto;
  padding:24px 20px 60px;
}

/* Buscador */
.buscador{
  display:flex;align-items:center;gap:10px;
  background:var(--tarjeta-claro);
  border:2px solid var(--borde-claro);
  border-radius:16px;
  padding:12px 16px;
  margin-bottom:16px;
  transition:all .2s,background .4s;
}
body.oscuro .buscador{background:var(--tarjeta-oscuro);border-color:var(--borde-oscuro)}
.buscador:focus-within{border-color:var(--principal);box-shadow:0 0 0 4px rgba(255,126,103,.15)}
.icono-buscar{font-size:18px}
.buscador input{
  flex:1;border:none;background:transparent;outline:none;
  font-family:'Quicksand',sans-serif;font-size:15px;
  color:var(--texto-claro);
}
body.oscuro .buscador input{color:var(--texto-oscuro)}

/* Filtros (botoncitos de estado) */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filtro{
  padding:8px 14px;
  border:2px solid var(--borde-claro);
  background:var(--tarjeta-claro);
  border-radius:20px;
  font-family:'Quicksand',sans-serif;
  font-size:13px;font-weight:600;
  color:var(--texto-suave-claro);
  cursor:pointer;
  transition:all .2s,background .4s;
}
body.oscuro .filtro{background:var(--tarjeta-oscuro);border-color:var(--borde-oscuro);color:var(--texto-suave-oscuro)}
.filtro.activo{
  background:var(--principal);
  border-color:var(--principal);
  color:#fff;
}

/* Lista de personas */
.lista-personas{list-style:none;display:flex;flex-direction:column;gap:10px}
.persona{
  display:flex;align-items:center;gap:14px;
  background:var(--tarjeta-claro);
  border:2px solid transparent;
  border-radius:18px;
  padding:14px 18px;
  cursor:pointer;
  transition:all .25s,background .4s;
  animation:aparecer .4s ease;
}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
body.oscuro .persona{background:var(--tarjeta-oscuro)}
.persona:hover{
  border-color:var(--principal);
  transform:translateX(6px);
  box-shadow:0 6px 18px rgba(255,126,103,.18);
}
.persona-info{flex:1}
.persona-nombre{font-weight:700;font-size:16px;margin-bottom:3px}
.persona-estado{font-size:13px;color:var(--texto-suave-claro);font-weight:500}
body.oscuro .persona-estado{color:var(--texto-suave-oscuro)}
.persona-estado .punto{font-size:11px;margin-right:4px}
.flecha{color:var(--texto-suave-claro);font-size:18px}
body.oscuro .flecha{color:var(--texto-suave-oscuro)}

/* Cuando alguien cambia de estado, se ilumina un momento */
.persona.cambio{animation:iluminar 1s ease}
@keyframes iluminar{
  0%{background:var(--acento)}
  100%{background:var(--tarjeta-claro)}
}
body.oscuro .persona.cambio{animation:iluminar-oscuro 1s ease}
@keyframes iluminar-oscuro{
  0%{background:#4A4466}
  100%{background:var(--tarjeta-oscuro)}
}

/* Mensaje cuando no hay resultados en la búsqueda */
.sin-resultados{
  text-align:center;
  padding:40px 20px;
  color:var(--texto-suave-claro);
  font-size:15px;
}
body.oscuro .sin-resultados{color:var(--texto-suave-oscuro)}
.sin-resultados .emoji{font-size:40px;display:block;margin-bottom:10px}

/* ===== Aviso (cartita al hacer clic en una persona) ===== */
.aviso{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}
.aviso.visible{display:flex}
.aviso-interior{
  background:var(--tarjeta-claro);
  border-radius:24px;
  padding:36px 30px;
  text-align:center;
  max-width:340px;
  width:100%;
  animation:pop .35s ease;
}
body.oscuro .aviso-interior{background:var(--tarjeta-oscuro)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.avatar-grande{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--acento),var(--principal));
  display:flex;align-items:center;justify-content:center;
  font-size:42px;margin:0 auto 16px;
}
.aviso-interior h3{font-size:22px;margin-bottom:6px}
.aviso-interior > p{font-size:14px;color:var(--texto-suave-claro);margin-bottom:6px}
body.oscuro .aviso-interior > p{color:var(--texto-suave-oscuro)}
.aviso-nota{
  background:var(--fondo-claro);
  border-radius:12px;
  padding:12px;
  margin:16px 0 20px !important;
  font-size:13px !important;
  line-height:1.5;
}
body.oscuro .aviso-nota{background:var(--fondo-oscuro)}
.btn-entrar{
  width:100%;
  padding:13px;
  background:linear-gradient(135deg,var(--principal),var(--principal-oscuro));
  color:#fff;border:none;border-radius:14px;
  font-family:'Quicksand',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:transform .2s;
}
.btn-entrar:hover{transform:translateY(-2px)}

/* ===== Celular ===== */
@media(max-width:560px){
  .barra-superior{padding:14px 16px}
  .texto-contador{display:none}
  .mi-perfil span{display:none}
}

</style>
</head>
<body>

  <!-- ===== Barra de arriba ===== -->
  <header class="barra-superior">
    <div class="logo-chico">Sala de Amigas ✨</div>

    <div class="info-centro">
      <span class="contador" id="contador">0</span>
      <span class="texto-contador">personas conectadas</span>
    </div>

    <div class="derecha">
      <button class="btn-tema" id="btnTema" title="Cambiar tema">🌙</button>
      <div class="mi-perfil">
        <div class="avatar yo">👩‍🦰</div>
        <span>Tú</span>
      </div>
    </div>
  </header>

  <!-- ===== Contenido principal ===== -->
  <main class="contenido">

    <!-- Buscador -->
    <div class="buscador">
      <span class="icono-buscar">🔍</span>
      <input type="text" id="buscar" placeholder="Buscar a una amiga...">
    </div>

    <!-- Filtros por estado -->
    <div class="filtros" id="filtros">
      <button class="filtro activo" data-estado="todos">Todas</button>
      <button class="filtro" data-estado="en-linea">🟢 En línea</button>
      <button class="filtro" data-estado="ocupada">🟠 Ocupada</button>
      <button class="filtro" data-estado="ausente">🟡 Ausente</button>
      <button class="filtro" data-estado="desconectada">⚪ Desconectada</button>
    </div>

    <!-- Lista de personas conectadas -->
    <ul class="lista-personas" id="listaPersonas">
      <!-- Aquí el cerebro (sala.js) va a poner a cada persona -->
    </ul>

  </main>

  <!-- ===== Cartita que aparece al hacer clic en una persona ===== -->
  <div class="aviso" id="aviso">
    <div class="aviso-interior">
      <div class="avatar-grande" id="avisoAvatar">👩</div>
      <h3 id="avisoNombre">Amiga</h3>
      <p id="avisoEstado">En línea</p>
      <p class="aviso-nota">💬 El chat uno a uno llega en la <strong>Fase 3</strong></p>
      <button class="btn-entrar" id="avisoCerrar">Entendido 👍</button>
    </div>
  </div>

  <script>
/* =====================================================
   sala.js  ·  LÓGICA de la Sala de Conectadas
   ===================================================== */

// ---------- 1. Nuestra lista de amigas (de mentirijilla, por ahora) ----------
// Cada una tiene: nombre, carita (avatar), y estado.
// Estados posibles: "en-linea", "ocupada", "ausente", "desconectada"
const amigas = [
  { nombre: 'María González',   avatar: '👩‍🦱', estado: 'en-linea' },
  { nombre: 'Ana Pérez',        avatar: '👩‍🦰', estado: 'en-linea' },
  { nombre: 'Luisa Fernández',  avatar: '👩',    estado: 'ocupada' },
  { nombre: 'Carmen Ruiz',      avatar: '👩‍🦳', estado: 'ausente' },
  { nombre: 'Sofía Martínez',   avatar: '👱‍♀️', estado: 'en-linea' },
  { nombre: 'Laura Gómez',      avatar: '👩‍🎤', estado: 'desconectada' },
  { nombre: 'Daniela Torres',   avatar: '👩‍🔬', estado: 'en-linea' },
  { nombre: 'Valeria Jiménez',  avatar: '👩‍🎨', estado: 'ocupada' },
  { nombre: 'Andrea López',     avatar: '🧑‍🦰', estado: 'ausente' },
  { nombre: 'Patricia Sánchez', avatar: '👩‍🏫', estado: 'en-linea' },
];

// Para escribir el estado en español (en vez de "en-linea" raro)
const estadoTexto = {
  'en-linea':      { texto: 'En línea ahora',        emoji: '🟢' },
  'ocupada':       { texto: 'Ocupada, no molestar',  emoji: '🟠' },
  'ausente':       { texto: 'Ausente, vuelve pronto',emoji: '🟡' },
  'desconectada':  { texto: 'Desconectada',          emoji: '⚪' },
};

// Qué filtro tenemos activo ahora mismo (empieza en "todas")
let filtroActivo = 'todos';
let textoBuscar = '';

// ---------- 2. Dibujar la lista en la pantalla ----------
function dibujarLista() {
  const lista = document.getElementById('listaPersonas');
  lista.innerHTML = ''; // borramos lo viejo para volver a pintar

  // Filtramos: primero por el buscador, luego por el botón de estado
  const filtradas = amigas
    .filter(a => a.nombre.toLowerCase().includes(textoBuscar.toLowerCase()))
    .filter(a => filtroActivo === 'todos' ? true : a.estado === filtroActivo);

  // Si no hay nadie que coincida, mostramos un mensajito
  if (filtradas.length === 0) {
    lista.innerHTML = '<li class="sin-resultados"><span class="emoji">🔍</span>No encontré a nadie con ese nombre</li>';
  }

  // Por cada amiga, creamos su "tarjetita" y la metemos a la lista
  filtradas.forEach(amiga => {
    const li = document.createElement('li');
    li.className = 'persona';
    li.dataset.nombre = amiga.nombre; // guardamos su nombre para el clic

    const info = estadoTexto[amiga.estado];

    li.innerHTML = `
      <div class="avatar">
        ${amiga.avatar}
        <span class="estado ${amiga.estado}"></span>
      </div>
      <div class="persona-info">
        <div class="persona-nombre">${amiga.nombre}</div>
        <div class="persona-estado"><span class="punto">${info.emoji}</span>${info.texto}</div>
      </div>
      <span class="flecha">›</span>
    `;

    // Al hacer clic en ella, mostramos la cartita de aviso
    li.addEventListener('click', () => mostrarAviso(amiga));

    lista.appendChild(li);
  });

  // Actualizamos el contador de "conectadas" (solo las en línea)
  const conectadas = amigas.filter(a => a.estado === 'en-linea').length;
  document.getElementById('contador').textContent = conectadas;
}

// ---------- 3. Simular "tiempo real": cada 3 segundos alguien cambia de estado ----------
function simularTiempoReal() {
  setInterval(() => {
    // Elegimos una amiga al azar
    const cual = Math.floor(Math.random() * amigas.length);
    const estados = ['en-linea', 'ocupada', 'ausente', 'desconectada'];
    // Le ponemos un estado al azar (distinto al que tiene)
    let nuevoEstado;
    do {
      nuevoEstado = estados[Math.floor(Math.random() * estados.length)];
    } while (nuevoEstado === amigas[cual].estado);

    amigas[cual].estado = nuevoEstado;
    dibujarLista();

    // Iluminamos la tarjetita que cambió, para que se note
    const tarjetita = document.querySelector(`[data-nombre="${amigas[cual].nombre}"]`);
    if (tarjetita) {
      tarjetita.classList.add('cambio');
      setTimeout(() => tarjetita.classList.remove('cambio'), 1000);
    }
  }, 3000); // cada 3000 milisegundos = 3 segundos
}

// ---------- 4. El buscador: según escribes, se filtra la lista ----------
document.getElementById('buscar').addEventListener('input', evento => {
  textoBuscar = evento.target.value;
  dibujarLista();
});

// ---------- 5. Los botoncitos de filtro (Todas / En línea / Ocupada...) ----------
document.querySelectorAll('.filtro').forEach(boton => {
  boton.addEventListener('click', () => {
    document.querySelectorAll('.filtro').forEach(b => b.classList.remove('activo'));
    boton.classList.add('activo');
    filtroActivo = boton.dataset.estado;
    dibujarLista();
  });
});

// ---------- 6. Modo claro / oscuro (igual que en el login) ----------
document.getElementById('btnTema').addEventListener('click', () => {
  document.body.classList.toggle('oscuro');
  document.getElementById('btnTema').textContent =
    document.body.classList.contains('oscuro') ? '☀️' : '🌙';
});

// ---------- 7. La cartita de aviso al hacer clic en una amiga ----------
function mostrarAviso(amiga) {
  document.getElementById('avisoAvatar').textContent = amiga.avatar;
  document.getElementById('avisoNombre').textContent = amiga.nombre;
  document.getElementById('avisoEstado').textContent = estadoTexto[amiga.estado].texto;
  document.getElementById('aviso').classList.add('visible');
}
document.getElementById('avisoCerrar').addEventListener('click', () => {
  document.getElementById('aviso').classList.remove('visible');
});
// Cerrar también al hacer clic fuera de la cartita
document.getElementById('aviso').addEventListener('click', evento => {
  if (evento.target.id === 'aviso') {
    document.getElementById('aviso').classList.remove('visible');
  }
});

// ---------- 8. ¡Arrancamos! ----------
dibujarLista();      // pintamos la lista
simularTiempoReal(); // encendemos el "tiempo real"

</script>
</body>
</html>
