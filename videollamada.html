<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E1B2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SalaAmigas">
  <link rel="apple-touch-icon" href="icono-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-videollamada">
  <div class="caja-video-remota">
    <div class="avatar-remoto" id="avatarRemoto">👩</div>
    <div class="audio-remoto"><span></span><span></span><span></span><span></span><span></span></div>
    <p class="nombre-remoto" id="nombreRemoto">Amiga</p>
  </div>

  <div class="caja-video-propia">
    <video id="miCamara" autoplay playsinline muted></video>
    <div class="sin-camara" id="sinCamara">📷 Iniciando cámara...</div>
  </div>

  <p class="tiempo" id="tiempo">00:00</p>

  <div class="controles-llamada">
    <button type="button" class="control" id="btnMicrofono">🎤</button>
    <a href="chat.html" class="control colgar">✕</a>
    <button type="button" class="control" id="btnCamara">📹</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>

</html>
