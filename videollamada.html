<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videollamada — Sala de Amigas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-videollamada">
  <div class="camaras">
    <div class="camara-remota">
      <div class="avatar-llamada" id="avatarRemoto">👩</div>
      <p class="nombre-remoto" id="nombreRemoto">Amiga</p>
    </div>
    
    <div class="camara-propia">
      <video id="miCamara" autoplay muted playsinline></video>
      <div class="sin-camara" id="mensajeSinCamara">
        📷<br><small>Permite acceso a cámara y micrófono</small>
      </div>
      <p class="nombre-propio">Tú</p>
    </div>
  </div>
  
  <p class="tiempo-llamada" id="tiempo">00:00</p>
  
  <div class="controles">
    <button class="control" id="btnMicrofono">🎤</button>
    <button class="control" id="btnCamara">📹</button>
    <a href="chat.html" class="control colgar">📞</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
