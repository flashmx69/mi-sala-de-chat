<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="pagina-chat">
  <div class="barra-chat">
    <a href="sala.html" class="boton-volver">←</a>
    <div class="info-amiga">
      <div class="avatar-grande" id="avatarAmiga">👩</div>
      <div>
        <h3 id="nombreAmiga">Amiga</h3>
        <p class="estado">🟢 Conectada</p>
      </div>
    </div>
    <a href="videollamada.html" class="boton-llamada">📹</a>
  </div>

  <div class="caja-mensajes" id="cajaMensajes"></div>
  <p class="escribiendo" id="indicadorEscribiendo">escribiendo...</p>

  <form class="barra-escribir" id="formMensaje">
    <input type="text" id="entradaMensaje" placeholder="Escribe un mensaje...">
    <button type="submit">➤</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
