<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — Sala de Amigas</title>
  <link rel="stylesheet" href="estilos.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="pagina-chat">

  <!-- 📹 COLUMNA IZQUIERDA: VIDEO -->
  <div class="col-video" id="colVideo">
    <button class="btn-cerrar-video" id="btnCerrarVideo">✕</button>
    
    <div class="sin-video" id="sinVideo">
      <div class="avatar">👩</div>
      <h3>Esperando video...</h3>
      <p>Conectando cámara</p>
    </div>
    
    <video id="videoRemoto" class="video-principal" autoplay playsinline style="display:none;"></video>
    
    <div class="video-chico" id="videoChico">
      <video id="videoLocal" autoplay muted playsinline></video>
    </div>
  </div>

  <!-- 💬 COLUMNA DERECHA: CHAT -->
  <div class="col-chat">
    <!-- Barra superior -->
    <div class="barra-arriba">
      <a href="sala.html" class="btn-atras">←</a>
      <div class="avatar">👩</div>
      <div class="info-chat">
        <h4 id="nombreAmiga">Amiga</h4>
        <div class="estado">● En línea</div>
      </div>
      <button class="btn-llamada" id="btnLlamada">📹</button>
    </div>

    <!-- Mensajes -->
    <div class="caja-msj" id="cajaMsj">
      <div class="msj mio">¡Hola! ¿Cómo estás?<div class="hora">21:45</div></div>
      <div class="msj tuyo">¡Bien! Aquí andamos probando 😊<div class="hora">21:46</div></div>
    </div>

    <!-- Barra escribir -->
    <div class="barra-abajo">
      <input type="text" id="inputMsj" placeholder="Escribe un mensaje...">
      <button class="btn-enviar" id="btnEnviar">➤</button>
    </div>
  </div>

</div>

<script>
// Obtener nombre desde la URL
const params = new URLSearchParams(window.location.search);
const nombre = params.get('nombre') || 'Amiga';
document.getElementById('nombreAmiga').textContent = nombre;

// Enviar mensajes

const btnEnviar = document.getElementById('btnEnviar
